[project]
name = "llauncher"
version = "0.4.1a0"
description = "MCP-first launcher for managing llama.cpp llama-server instances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
cli = ["typer>=0.9.0", "rich>=13.0.0"]
ui = ["streamlit>=1.30.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
llauncher = "llauncher.cli:app"
llauncher-mcp = "llauncher.mcp_server.server:main"
llauncher-agent = "llauncher.agent:main"
llauncher-ui = "llauncher.ui.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
#
# The Streamlit UI is measured alongside everything else: the AppTest
# harness landed via #328 (all 7 tabs driven behaviorally, per-module
# 96–100%), so the old UI/non-UI split — and its ``llauncher/ui/*``
# omit — is gone (#329). The ``--cov-fail-under`` floor in ``pytest.ini``
# ``addopts`` is the *measured combined* number rounded down, not a
# per-population compromise. Only genuine entry-point shims remain
# omitted below, each with its rationale inline.

[tool.coverage.run]
source = ["llauncher"]
branch = false
omit = [
    # Console-script entry shim for ``llauncher-ui`` that subprocess-execs
    # ``python -m streamlit run`` (no cross-layer import, by design). Same
    # entry-shim category as ``agent/__main__.py`` / ``mcp_server/__main__.py``
    # below: its pure helpers are separable, but the module as a whole is not
    # unit-import-testable. The rest of ``llauncher/ui/`` is measured (#329).
    "llauncher/ui/launch.py",
    # CLI entry-point shim for ``python -m llauncher.agent``; covered
    # indirectly through integration runs of the agent, not unit tests.
    "llauncher/agent/__main__.py",
    # ``python -m llauncher.mcp_server`` entry shim — a 2-line passthrough
    # to ``mcp_server.server:main`` that runs ``_main()`` at import time, so
    # it cannot be unit-imported without launching the stdio server. Omitted
    # for parity with ``agent/__main__.py`` above (same entry-shim category);
    # ``server.main`` / ``server.main_async`` themselves are unit-covered.
    "llauncher/mcp_server/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
