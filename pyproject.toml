[project]
name = "llauncher"
version = "0.4.1a0"
description = "MCP-first launcher for managing llama.cpp llama-server instances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
llauncher = "llauncher.cli:app"
llauncher-mcp = "llauncher.mcp_server.server:main"
llauncher-agent = "llauncher.agent:main"
llauncher-ui = "llauncher.ui.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
#
# The Streamlit UI is measured alongside everything else: the AppTest
# harness landed via #328 (all 7 tabs driven behaviorally, per-module
# 96–100%), so the old UI/non-UI split — and its ``llauncher/ui/*``
# omit — is gone (#329). The ``--cov-fail-under`` floor in ``pytest.ini``
# ``addopts`` is the *measured combined* number rounded down, not a
# per-population compromise. Only genuine entry-point shims remain
# omitted below, each with its rationale inline.

[tool.coverage.run]
source = ["llauncher"]
branch = false
# Record file paths relative to this file's directory rather than absolute.
# This is what makes the ``[tool.coverage.paths]`` alias below actually
# match: coverage's path-alias machinery matches relative-path fragments,
# so a worktree-recorded ``.claude/worktrees/<name>/llauncher/...`` path
# can be collapsed onto the canonical ``llauncher/...`` root at
# combine/report time instead of staying a separate, absolute identity (#361).
relative_files = true
omit = [
    # Console-script entry shim for ``llauncher-ui`` that subprocess-execs
    # ``python -m streamlit run`` (no cross-layer import, by design). Same
    # entry-shim category as ``agent/__main__.py`` / ``mcp_server/__main__.py``
    # below: its pure helpers are separable, but the module as a whole is not
    # unit-import-testable. The rest of ``llauncher/ui/`` is measured (#329).
    "llauncher/ui/launch.py",
    # CLI entry-point shim for ``python -m llauncher.agent``; covered
    # indirectly through integration runs of the agent, not unit tests.
    "llauncher/agent/__main__.py",
    # ``python -m llauncher.mcp_server`` entry shim — a 2-line passthrough
    # to ``mcp_server.server:main`` that runs ``_main()`` at import time, so
    # it cannot be unit-imported without launching the stdio server. Omitted
    # for parity with ``agent/__main__.py`` above (same entry-shim category);
    # ``server.main`` / ``server.main_async`` themselves are unit-covered.
    "llauncher/mcp_server/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# Worktree path mapping (#361)
# ---------------------------------------------------------------------------
#
# The shared venv's editable install (`_editable_impl_llauncher.pth`) always
# resolves `llauncher` to the main checkout, regardless of which worktree
# pytest is invoked from. When a worktree run's import resolution loses that
# race, coverage measures against the main checkout's path and the worktree
# run's own `source` root above never matches it — the run reads as ~0%
# covered instead of erroring, which is a plausible-looking but false number,
# not the environment defect it actually is (observed twice: PR #359 review,
# PR #222 conflict-resolution report). This alias reconciles the *report*
# (combine/report canonicalize any of these patterns onto `llauncher/`); it
# does not touch the venv or the editable install. The sanctioned invocation
# — `PYTHONPATH=<worktree> pytest` from inside the worktree (README.md
# Testing section) — is what fixes import resolution itself; never repoint
# the shared `.pth` to work around this, since that venv also backs the live
# `llauncher-agent` systemd service.
[tool.coverage.paths]
source = [
    "llauncher",
    ".claude/worktrees/*/llauncher",
    "/tmp/wt-*/llauncher",
]
